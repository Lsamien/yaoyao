<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>App 更新 · 夭夭</title><link rel="stylesheet" href="update.css"></head>
<body><main>
<header><p class="eyebrow">夭夭 · macOS</p><h1>App 更新</h1><p>从 GitHub 下载，校验后手动安装。</p></header>
<section class="versions" aria-label="版本信息"><div><span>当前版本</span><strong id="current">—</strong></div><div><span>最新版本</span><strong id="latest">待检查</strong></div></section>
<p id="status" role="status" aria-live="polite">正在检查…</p><p id="error" role="alert" hidden></p>
<progress id="progress" aria-label="安装包下载进度" hidden></progress><p id="bytes" class="muted"></p>
<div class="actions"><button id="check">检查更新</button><button id="download" class="primary" disabled>下载 DMG</button><button id="cancel" hidden>取消</button><button id="open" class="primary" hidden>打开安装包</button><button id="folder" hidden>打开所在文件夹</button></div>
<details id="notes-section" hidden><summary>发布说明</summary><pre id="notes"></pre></details>
<footer><button id="release" class="link">查看 GitHub 发布页</button><p>下载不会停止聊天或后台服务。安装时将“夭夭”拖入“应用程序”；首次启动会同步较旧的本机 Web。</p><p>当前桌面包为开发签名，未公证。请遵循 macOS 安装提示。</p></footer>
</main><script src="update.js"></script></body></html>
