appId: cn.samien.yaoyao.desktop
productName: 夭夭
directories:
  output: desktop-release
  app: .desktop-build/shell
files:
  - '**/*'
extraResources:
  - from: .desktop-build
    to: runtime
    filter:
      - server.mjs
      - server.mjs.map
      - runner.mjs
      - runner.mjs.map
      - runner-image.mjs
      - runner-maintenance.mjs
      - computer-image/**/*
      - third-party/**/*
      - runner-config.mjs
      - runner-config.mjs.map
      - hermes_worker.py
      - profile_skills.py
      - skill_bundle.py
      - hermes-bots-bridge/**/*
      - install-hermes-bridge.py
      - guest_proxy.py
      - release.json
      - build-info.json
      - github-release.mjs
      - electron-updater.cjs
      - keychain-helper
      - computer-helper
      - computer-helper.exe
      - ui/**/*
      - web-service/**/*
asar: true
npmRebuild: false
win:
  files:
    - '**/*'
    - '!**/node_modules/**'
  executableName: Yaoyao
  icon: .desktop-build/branding/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: Yaoyao-${version}-win-${arch}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
mac:
  # Keep the independently signed Node runtime byte-identical to its sealed manifest.
  signIgnore:
    - /web-service/node$
  category: public.app-category.productivity
  icon: .desktop-build/branding/icon.icns
  target:
    - target: dir
      arch: [arm64]
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: 夭夭使用麦克风接收语音消息。
dmg:
  title: 夭夭 ${version}
artifactName: Yaoyao-${version}-${arch}.${ext}
publish:
  - provider: github
    owner: Lsamien
    repo: yaoyao
    releaseType: release
